<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Árbol de Habilidades y Estados</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="merit-display">
            Mérito: <span id="merit-count">0</span>
        </div>
        <div class="header-controls">
            <button id="add-merit-btn" class="btn">Añadir Mérito (+10)</button>
            <button id="reset-btn" class="btn btn-danger">Reiniciar Progreso</button>
        </div>
    </header>

    <!-- Sistema de navegación por pestañas -->
    <nav class="tabs-nav">
        <button class="tab-btn active" data-target="tab-rasgos">Rasgos</button>
        <button class="tab-btn" data-target="tab-estados">Estados</button>
    </nav>

    <main class="main-content">
        <!-- Pestaña: Rasgos (Árbol de Habilidades) -->
        <section id="tab-rasgos" class="tab-content active">
            <div class="tree-container">
                <!-- SVG para las líneas conectoras -->
                <svg id="connections-svg"></svg>

                <!-- Contenedor donde se generarán los nodos del árbol dinámicamente -->
                <div id="nodes-container"></div>
            </div>
        </section>

        <!-- Pestaña: Estados -->
        <section id="tab-estados" class="tab-content">
            <div class="states-container" id="states-container">
                <!-- Los estados se inyectarán aquí -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
